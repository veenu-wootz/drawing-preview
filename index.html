<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Matching the host page's scheme keeps the iframe transparent; a mismatch makes Chrome paint it solid white. -->
<meta name="color-scheme" content="light dark" id="cs">
<script>
  // ?scheme=dark|light forces a match when the app theme differs from the device theme.
  (function () { var s = new URLSearchParams(location.search).get("scheme"); if (s === "dark" || s === "light") document.getElementById("cs").content = s; })();
</script>
<title>Drawing Preview</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preconnect" href="https://storage.googleapis.com" crossorigin>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  #stage { position: fixed; inset: 0; display: flex; align-items: flex-start; justify-content: center; }
  #stage.center { align-items: center; }
  #msg, .spin { align-self: center; }
  #stage > img, #stage > canvas { display: block; max-width: 100%; max-height: 100%; object-fit: contain; background: #fff; }
  #msg { font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #888; text-align: center; padding: 16px; }
  .spin { width: 22px; height: 22px; border: 2px solid #8884; border-top-color: #888; border-radius: 50%; animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="stage"><div class="spin"></div></div>
<script>
(function () {
  var PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
  var WORKER = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  var MAX_PX = 4096; // cap canvas size so mobile devices don't run out of memory

  var stage = document.getElementById("stage");
  var q = new URLSearchParams(location.search);
  var url = (q.get("url") || "").trim();
  var type = (q.get("type") || "").toLowerCase(); // optional: "pdf" or "image"
  var pageNo = Math.max(1, parseInt(q.get("page"), 10) || 1);
  if (q.get("bg")) document.body.style.background = q.get("bg");
  if (q.get("align") === "center") stage.className = "center";

  function show(el) { stage.innerHTML = ""; stage.appendChild(el); }
  function fail(text) {
    var d = document.createElement("div");
    d.id = "msg";
    d.textContent = text;
    show(d);
  }

  function showImage(src, onError) {
    var img = new Image();
    img.decoding = "async";
    img.onload = function () { show(img); };
    img.onerror = onError || function () { fail("Could not load drawing."); };
    img.src = src;
  }

  function ok(r) { if (!r.ok) throw new Error(r.status + " " + r.url); return r; }

  // Library, worker and PDF bytes all download in parallel instead of one after another.
  function showPdf(src) {
    var libP = new Promise(function (res, rej) {
      var s = document.createElement("script");
      s.src = PDFJS; s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });
    var workerP = fetch(WORKER).then(ok).then(function (r) { return r.blob(); });
    var dataP = fetch(src).then(ok).then(function (r) { return r.arrayBuffer(); });

    Promise.all([libP, workerP, dataP]).then(function (v) {
      var lib = window.pdfjsLib;
      lib.GlobalWorkerOptions.workerPort = new Worker(URL.createObjectURL(v[1]));
      return lib.getDocument({ data: new Uint8Array(v[2]), isEvalSupported: false }).promise;
    }).then(function (pdf) {
      return pdf.getPage(Math.min(pageNo, pdf.numPages));
    }).then(function (page) {
      var base = page.getViewport({ scale: 1 });
      var px = Math.min(MAX_PX, Math.ceil(Math.max(innerWidth, innerHeight) * (devicePixelRatio || 1) * 1.5));
      var vp = page.getViewport({ scale: px / Math.max(base.width, base.height) });
      var canvas = document.createElement("canvas");
      canvas.width = Math.floor(vp.width);
      canvas.height = Math.floor(vp.height);
      var ctx = canvas.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      return page.render({ canvasContext: ctx, viewport: vp }).promise.then(function () {
        show(canvas);
        page.cleanup();
      });
    }).catch(function (e) {
      console.error(e);
      fail("Could not load drawing. The file host may be blocking access (CORS).");
    });
  }

  var path = url.split(/[?#]/)[0];
  if (!url) fail("No drawing URL.");
  else if (type === "pdf" || (type !== "image" && /\.pdf$/i.test(path))) showPdf(url);
  else if (type === "image" || /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(path)) showImage(url);
  else showImage(url, function () { showPdf(url); }); // unknown extension: try image, then PDF
})();
</script>
</body>
</html>
